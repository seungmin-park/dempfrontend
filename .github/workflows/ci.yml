name: DEMP frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DEMP frontend verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Capture Git input before dependency install
        run: |
          snapshot="$RUNNER_TEMP/demp-source-before-install.json"
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - capture "$GITHUB_WORKSPACE" "$snapshot" '${{ github.sha }}'
          echo "DEMP_VERIFY_SOURCE_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
      - name: Install dependencies with input checks
        run: |
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
          npm ci
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
      - name: Install browser with input checks
        run: |
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
          npx playwright install --with-deps chromium
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
      - name: Verify and check input before evidence upload
        run: |
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
          npm run verify
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
          cp "$DEMP_VERIFY_SOURCE_SNAPSHOT" .verification/source-before-install.json
      - name: Verify CD source and artifact contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
          python3 -m unittest discover -s tests/deployment -v
          git --no-replace-objects show '${{ github.sha }}:scripts/verification-source.mjs' | node --input-type=module - check "$GITHUB_WORKSPACE" "$DEMP_VERIFY_SOURCE_SNAPSHOT" '${{ github.sha }}'
      - name: Package the verified production frontend
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_component.py dempfrontend --output .verification/deployment
      - name: Preserve deployment payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-dempfrontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/deployment/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-verification-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .verification/
            dist/
            test-results/
            playwright-report/
